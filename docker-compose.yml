# Local development services. Values like ${POSTGRES_PASSWORD} are read from .env.
services:
  postgres:
    image: postgres:17
    environment:
      # Only applied the first time the data volume is created.
      POSTGRES_USER: ${POSTGRES_USER:-courier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-courier_ops}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
